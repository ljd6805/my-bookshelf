<svg class="bf-ill" viewBox="0 0 340 180" role="img" aria-labelledby="bf-ill-title" xmlns="http://www.w3.org/2000/svg">
<title id="bf-ill-title">선우의 일지에서 보유 기간 막대가 함께 자라다가, 이익 난 새벽전자·가람200·누리 해외100의 칸은 일찍 팔려 흐려지고, 손실 난 온결식품의 칸만 오래 남는 처분 효과 과정(미리 정한 가상 시나리오)</title>
<style>
.bf-ill-bg{fill:#f6f8fc}
.bf-ill-word{font:600 10px sans-serif;fill:#172235}
.bf-ill-small{font:500 9px sans-serif;fill:#465366}
.bf-ill-track{fill:#e6ecf6}
.bf-ill-bar{transform-box:fill-box;transform-origin:left center}
.bf-ill-gain{fill:#1d4f9c}
.bf-ill-loss{fill:#a3381a}
.bf-ill-g4{animation:bf-ill-grow4 10s linear infinite}
.bf-ill-g6{animation:bf-ill-grow6 10s linear infinite}
.bf-ill-g7{animation:bf-ill-grow7 10s linear infinite}
.bf-ill-l19{animation:bf-ill-grow19 10s linear infinite}
.bf-ill-sold4{animation:bf-ill-fade4 10s linear infinite}
.bf-ill-sold6{animation:bf-ill-fade6 10s linear infinite}
.bf-ill-sold7{animation:bf-ill-fade7 10s linear infinite}
@keyframes bf-ill-grow4{0%{transform:scaleX(0)}14%,100%{transform:scaleX(1)}}
@keyframes bf-ill-grow6{0%{transform:scaleX(0)}21%,100%{transform:scaleX(1)}}
@keyframes bf-ill-grow7{0%{transform:scaleX(0)}25%,100%{transform:scaleX(1)}}
@keyframes bf-ill-grow19{0%{transform:scaleX(0)}68%,100%{transform:scaleX(1)}}
@keyframes bf-ill-fade4{0%,14%{opacity:1}20%,94%{opacity:.35}100%{opacity:1}}
@keyframes bf-ill-fade6{0%,21%{opacity:1}27%,94%{opacity:.35}100%{opacity:1}}
@keyframes bf-ill-fade7{0%,25%{opacity:1}31%,94%{opacity:.35}100%{opacity:1}}
@media(prefers-reduced-motion:reduce){.bf-ill-g4,.bf-ill-g6,.bf-ill-g7,.bf-ill-l19{animation:none;transform:none}.bf-ill-sold4,.bf-ill-sold6,.bf-ill-sold7{animation:none;opacity:.35}}
html[data-motion=reduce] .bf-ill-g4,html[data-motion=reduce] .bf-ill-g6,html[data-motion=reduce] .bf-ill-g7,html[data-motion=reduce] .bf-ill-l19{animation:none;transform:none}html[data-motion=reduce] .bf-ill-sold4,html[data-motion=reduce] .bf-ill-sold6,html[data-motion=reduce] .bf-ill-sold7{animation:none;opacity:.35}
</style>
<rect class="bf-ill-bg" width="340" height="180" rx="10"/>
<text class="bf-ill-word" x="14" y="20">선우의 일지 · 산 날부터 판 날까지</text>
<g class="bf-ill-sold4"><text class="bf-ill-word" x="14" y="46">새벽전자</text><rect class="bf-ill-track" x="104" y="37" width="222" height="11" rx="2"/><rect class="bf-ill-bar bf-ill-gain bf-ill-g4" x="104" y="37" width="34" height="11" rx="2"/><text class="bf-ill-small" x="104" y="60">이익 · 일찍 팖</text></g>
<g class="bf-ill-sold6"><text class="bf-ill-word" x="14" y="80">가람200</text><rect class="bf-ill-track" x="104" y="71" width="222" height="11" rx="2"/><rect class="bf-ill-bar bf-ill-gain bf-ill-g6" x="104" y="71" width="51" height="11" rx="2"/><text class="bf-ill-small" x="104" y="94">이익 · 일찍 팖</text></g>
<g class="bf-ill-sold7"><text class="bf-ill-word" x="14" y="114">누리 해외100</text><rect class="bf-ill-track" x="104" y="105" width="222" height="11" rx="2"/><rect class="bf-ill-bar bf-ill-gain bf-ill-g7" x="104" y="105" width="60" height="11" rx="2"/><text class="bf-ill-small" x="104" y="128">이익 · 일찍 팖</text></g>
<text class="bf-ill-word" x="14" y="148">온결식품</text><rect class="bf-ill-track" x="104" y="139" width="222" height="11" rx="2"/><rect class="bf-ill-bar bf-ill-loss bf-ill-l19" x="104" y="139" width="162" height="11" rx="2"/><text class="bf-ill-small" x="104" y="162">손실 · 오래 들고 있다 팖</text>
<text class="bf-ill-small" x="326" y="175" text-anchor="end">막대 길이는 보유한 주 수</text>
</svg>
