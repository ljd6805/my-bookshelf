<svg class="dx-ill" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 180" role="img" aria-label="그릇 모양 손실 곡면 위를 세로 면이 지나가며 단면을 자르고, 점 하나가 기울기 반대쪽으로 걸어 바닥에 닿는 동안 오른쪽 계산 그래프에서는 변화율이 손실에서 가중치 쪽으로 거꾸로 전해지는 과정을 보여 주는 시각적 비유">
<style>
.dx-ill-bg{fill:#fbf3f4}
.dx-ill-mesh{stroke:#b98a95;stroke-width:.8;fill:none}
.dx-ill-wall{fill:#a8324f;opacity:.16;animation:dx-ill-slide 6s ease-in-out infinite alternate}
.dx-ill-path{stroke:#7a2038;stroke-width:1.6;fill:none;stroke-dasharray:3 3}
.dx-ill-dot{fill:#a8324f;stroke:#fff;stroke-width:1.5;animation:dx-ill-walk 6s ease-in-out infinite}
.dx-ill-label{font:600 11px sans-serif;fill:#5a1a2b}
.dx-ill-small{font:500 10px sans-serif;fill:#76555d}
.dx-ill-node{fill:#fff;stroke:#3c6fb0;stroke-width:1.6}
.dx-ill-edge{stroke:#9a8086;stroke-width:1.4;fill:none}
.dx-ill-pulse{fill:#a8324f;animation:dx-ill-back 6s linear infinite}
.dx-ill-bar{fill:#c26a1d;opacity:.6;transform-box:fill-box;transform-origin:center bottom;animation:dx-ill-loss 6s ease-in-out infinite}
@keyframes dx-ill-slide{0%{transform:translate(0,0)}100%{transform:translate(-46.8px,30.1px)}}
@keyframes dx-ill-walk{0%{transform:translate(0.0px,0.0px)}18%{transform:translate(26.5px,29.9px)}36%{transform:translate(47.1px,44.6px)}52%{transform:translate(62.6px,50.3px)}66%{transform:translate(73.1px,51.2px)}80%{transform:translate(79.8px,50.3px)}100%{transform:translate(79.8px,50.3px)}}
@keyframes dx-ill-back{0%,10%{transform:translate(0,0);opacity:0}15%{opacity:1}45%{transform:translate(-44px,0);opacity:1}80%{transform:translate(-88px,0);opacity:1}90%,100%{transform:translate(-88px,0);opacity:0}}
@keyframes dx-ill-loss{0%{transform:scaleY(1)}18%{transform:scaleY(.6)}36%{transform:scaleY(.36)}52%{transform:scaleY(.2)}66%{transform:scaleY(.12)}80%,100%{transform:scaleY(.07)}}
html[data-motion=reduce] .dx-ill-wall,html[data-motion=reduce] .dx-ill-dot,html[data-motion=reduce] .dx-ill-pulse,html[data-motion=reduce] .dx-ill-bar{animation:none}
html[data-motion=reduce] .dx-ill-dot{transform:translate(79.8px,50.3px)}
html[data-motion=reduce] .dx-ill-bar{transform:scaleY(.07)}
@media(prefers-reduced-motion:reduce){.dx-ill-wall,.dx-ill-dot,.dx-ill-pulse,.dx-ill-bar{animation:none}.dx-ill-dot{transform:translate(79.8px,50.3px)}.dx-ill-bar{transform:scaleY(.07)}}
</style>
