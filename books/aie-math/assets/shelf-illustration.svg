<svg class="a02-ill" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 180" role="img" aria-label="음성 명령 소리가 주파수 막대로 나뉘고, 공이 손실 그릇을 따라 흔들리며 바닥으로 내려가는 그림. 경사하강을 보여 주는 시각적 비유이며 실제 계산은 아닙니다.">
<style>
.a02-ill-bg{fill:#f3f6ef}
.a02-ill-frame{fill:#fffdf6;stroke:#c9d6c4;stroke-width:1.5}
.a02-ill-label{font:700 11px sans-serif;fill:#2b4636;text-anchor:middle}
.a02-ill-title{font:700 12px sans-serif;fill:#2b4636}
.a02-ill-axis{stroke:#c9d6c4;stroke-width:1.5}
.a02-ill-wave{fill:none;stroke:#3f6fa8;stroke-width:2.5;stroke-linecap:round;stroke-dasharray:160;animation:a02-ill-draw 3.6s ease-in-out infinite}
.a02-ill-bar{fill:#2f8a5b;transform-box:fill-box;transform-origin:center bottom;animation:a02-ill-bar 3.6s ease-in-out infinite}
.a02-ill-bar2{animation-delay:.3s;fill:#4ea676}
.a02-ill-noise{fill:#c97a2b;transform-box:fill-box;transform-origin:center bottom;animation:a02-ill-bar 3.6s ease-in-out infinite;animation-delay:.6s}
.a02-ill-bowl{fill:none;stroke:#3f6fa8;stroke-width:2.5}
.a02-ill-ball{fill:#c97a2b;stroke:#fffdf6;stroke-width:1.5;animation:a02-ill-roll 5.4s ease-in-out infinite}
.a02-ill-arrow{stroke:#8aa095;stroke-width:2;fill:none;stroke-dasharray:4 4;animation:a02-ill-dash 1.2s linear infinite}
@keyframes a02-ill-draw{0%{stroke-dashoffset:160}45%,100%{stroke-dashoffset:0}}
@keyframes a02-ill-bar{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
@keyframes a02-ill-dash{to{stroke-dashoffset:-16}}
@keyframes a02-ill-roll{0%{transform:translate(0px,0px)}9%{transform:translate(102px,16px)}18%{transform:translate(14px,26px)}27%{transform:translate(90px,35px)}36%{transform:translate(28px,45px)}45%{transform:translate(78px,49px)}55%{transform:translate(40px,54px)}64%{transform:translate(66px,56px)}73%{transform:translate(50px,58px)}82%,100%{transform:translate(55px,59px)}}
html[data-motion=reduce] .a02-ill-wave,html[data-motion=reduce] .a02-ill-bar,html[data-motion=reduce] .a02-ill-noise,html[data-motion=reduce] .a02-ill-arrow{animation:none;stroke-dashoffset:0;transform:none}
html[data-motion=reduce] .a02-ill-ball{animation:none;transform:translate(55px,59px)}
@media(prefers-reduced-motion:reduce){.a02-ill-wave,.a02-ill-bar,.a02-ill-noise,.a02-ill-arrow{animation:none;stroke-dashoffset:0;transform:none}.a02-ill-ball{animation:none;transform:translate(55px,59px)}}
</style>
<rect class="a02-ill-bg" width="340" height="180"/>
<text class="a02-ill-title" x="14" y="22">말귀 · 소리에서 학습까지</text>
<rect class="a02-ill-frame" x="10" y="34" width="150" height="132" rx="8"/>
<path class="a02-ill-axis" d="M18 80H90M98 140H152"/>
<path class="a02-ill-wave" d="M18 80C24 56 30 56 36 80S48 104 54 80 66 60 72 80 84 96 90 80"/>
<text class="a02-ill-label" x="54" y="124">소리</text>
<rect class="a02-ill-bar" x="102" y="78" width="10" height="62" rx="2"/>
<rect class="a02-ill-bar a02-ill-bar2" x="118" y="104" width="10" height="36" rx="2"/>
<rect class="a02-ill-noise" x="134" y="116" width="10" height="24" rx="2"/>
<text class="a02-ill-label" x="124" y="158">주파수</text>
<path class="a02-ill-arrow" d="M164 100H184"/>
<rect class="a02-ill-frame" x="188" y="34" width="142" height="132" rx="8"/>
<path class="a02-ill-axis" d="M196 150H322"/>
<path class="a02-ill-bowl" d="M195 70Q255 210 315 70"/>
<circle class="a02-ill-ball" cx="200" cy="74" r="7"/>
<text class="a02-ill-label" x="259" y="62">손실 그릇</text>
<text class="a02-ill-label" x="259" y="160">기울기 따라 바닥으로</text>
</svg>
