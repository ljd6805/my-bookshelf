<svg class="op-ill" viewBox="0 0 340 180" role="img" aria-labelledby="op-ill-title" xmlns="http://www.w3.org/2000/svg">
<title id="op-ill-title">질문 “Describe your home.”을 들은 뒤 답이 도입·세부·예·마무리 네 덩어리로 차례로 채워지고, 아래 시간 막대가 2분 20초를 향해 차오르는 과정</title>
<style>
.op-ill-bg{fill:#faf5f6}
.op-ill-bubble{fill:#fff;stroke:#a3284f;stroke-width:2}
.op-ill-q{font:600 11px sans-serif;fill:#2b1e24}
.op-ill-title{font:700 11px sans-serif;fill:#2b1e24}
.op-ill-label{font:600 9.5px sans-serif;fill:#2b1e24}
.op-ill-muted{font:500 8.5px sans-serif;fill:#65525b}
.op-ill-slot{fill:none;stroke:#dccbd2;stroke-width:1.5;stroke-dasharray:4 3}
.op-ill-b1{fill:#aebbe8}.op-ill-b2{fill:#e7a3b9}.op-ill-b3{fill:#f0c39a}.op-ill-b4{fill:#cbbcc4}
.op-ill-blk{transform-box:fill-box;transform-origin:left center;transform:scaleX(0)}
.op-ill-k1{animation:op-ill-k1 10s ease-out infinite}.op-ill-k2{animation:op-ill-k2 10s ease-out infinite}.op-ill-k3{animation:op-ill-k3 10s ease-out infinite}.op-ill-k4{animation:op-ill-k4 10s ease-out infinite}
.op-ill-time{transform-box:fill-box;transform-origin:left center;animation:op-ill-time 10s linear infinite;fill:#a3284f}
.op-ill-track{fill:#f1e6ea}
.op-ill-wave{fill:none;stroke:#a3284f;stroke-width:2;stroke-linecap:round;animation:op-ill-wave 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.op-ill-qa{animation:op-ill-qa 10s infinite}
@keyframes op-ill-k1{0%,12%{transform:scaleX(0)}20%,94%{transform:scaleX(1)}100%{transform:scaleX(0)}}
@keyframes op-ill-k2{0%,22%{transform:scaleX(0)}40%,94%{transform:scaleX(1)}100%{transform:scaleX(0)}}
@keyframes op-ill-k3{0%,42%{transform:scaleX(0)}62%,94%{transform:scaleX(1)}100%{transform:scaleX(0)}}
@keyframes op-ill-k4{0%,64%{transform:scaleX(0)}74%,94%{transform:scaleX(1)}100%{transform:scaleX(0)}}
@keyframes op-ill-time{0%,12%{transform:scaleX(0)}76%,94%{transform:scaleX(1)}100%{transform:scaleX(0)}}
@keyframes op-ill-wave{50%{transform:scaleY(.4)}}
@keyframes op-ill-qa{0%,10%{opacity:1}14%,100%{opacity:.35}}
@media(prefers-reduced-motion:reduce){.op-ill-blk,.op-ill-time{animation:none;transform:scaleX(1)}.op-ill-wave,.op-ill-qa{animation:none}}
html[data-motion=reduce] .op-ill-blk,html[data-motion=reduce] .op-ill-time{animation:none;transform:scaleX(1)}html[data-motion=reduce] .op-ill-wave,html[data-motion=reduce] .op-ill-qa{animation:none}
</style>
<rect class="op-ill-bg" width="340" height="180"/>
<text class="op-ill-title" x="18" y="22">질문 하나에 답을 네 덩어리로</text>
<g class="op-ill-qa"><rect class="op-ill-bubble" x="18" y="32" width="150" height="30" rx="12"/><path class="op-ill-bubble" d="M40 62L34 72L52 62"/><text class="op-ill-q" x="30" y="51">Describe your home.</text></g>
<g transform="translate(200 34)"><path class="op-ill-wave" d="M0 14V14M8 6V22M16 10V18M24 2V26M32 8V20M40 4V24M48 11V17"/><text class="op-ill-muted" x="58" y="18">녹음 중</text></g>
<rect class="op-ill-slot" x="18" y="86" width="40" height="34" rx="5"/><rect class="op-ill-slot" x="62" y="86" width="116" height="34" rx="5"/><rect class="op-ill-slot" x="182" y="86" width="88" height="34" rx="5"/><rect class="op-ill-slot" x="274" y="86" width="48" height="34" rx="5"/>
<rect class="op-ill-blk op-ill-k1 op-ill-b1" x="18" y="86" width="40" height="34" rx="5"/><rect class="op-ill-blk op-ill-k2 op-ill-b2" x="62" y="86" width="116" height="34" rx="5"/><rect class="op-ill-blk op-ill-k3 op-ill-b3" x="182" y="86" width="88" height="34" rx="5"/><rect class="op-ill-blk op-ill-k4 op-ill-b4" x="274" y="86" width="48" height="34" rx="5"/>
<text class="op-ill-label" x="38" y="107" text-anchor="middle">도입</text><text class="op-ill-label" x="120" y="107" text-anchor="middle">세부</text><text class="op-ill-label" x="226" y="107" text-anchor="middle">예·이야기</text><text class="op-ill-label" x="298" y="107" text-anchor="middle">마무리</text>
<text class="op-ill-muted" x="38" y="134" text-anchor="middle">어디·무엇</text><text class="op-ill-muted" x="120" y="134" text-anchor="middle">보이는 순서·이유</text><text class="op-ill-muted" x="226" y="134" text-anchor="middle">지난 토요일(과거형)</text><text class="op-ill-muted" x="298" y="134" text-anchor="middle">나에게 어떤 곳</text>
<rect class="op-ill-track" x="18" y="148" width="304" height="10" rx="5"/><rect class="op-ill-time" x="18" y="148" width="304" height="10" rx="5"/>
<text class="op-ill-muted" x="18" y="173">0초</text><text class="op-ill-muted" x="322" y="173" text-anchor="end">2분 20초 (40분 ÷ 15문항, 듣기 20초 뺌)</text>
</svg>
