<svg class="ai-ill" viewBox="0 0 340 180" role="img" aria-label="입력 신호가 신경망의 층을 건너 출력 확률로 바뀌는 모습" xmlns="http://www.w3.org/2000/svg">
<style>
.ai-ill{--ai-ill-ink:#2f6f70;--ai-ill-glow:#1f9a9c}
.ai-ill-edge{stroke:#5f8f8c;stroke-opacity:.28;stroke-width:1.2}
.ai-ill-signal{stroke:var(--ai-ill-glow);stroke-width:2.6;stroke-linecap:round;stroke-dasharray:14 100;stroke-dashoffset:14;opacity:0;animation:ai-ill-flow 3.6s cubic-bezier(.45,0,.3,1) infinite}
.ai-ill-second{animation-name:ai-ill-flow-late}
.ai-ill-node{fill:#fffaf0;stroke:var(--ai-ill-ink);stroke-width:1.6;animation:ai-ill-pulse 3.6s ease-in-out infinite}
.ai-ill-bar{fill:var(--ai-ill-glow);transform-box:fill-box;transform-origin:left center;animation:ai-ill-bar 3.6s cubic-bezier(.3,1.3,.5,1) infinite}
.ai-ill-bar.low{fill:#9bb8b3}
.ai-ill-track{fill:#dfe8e2}
.ai-ill-text{font:600 10px sans-serif;fill:#4f6662;letter-spacing:.02em}
@keyframes ai-ill-flow{0%{stroke-dashoffset:14;opacity:0}4%{opacity:1}30%{stroke-dashoffset:-100;opacity:1}31%,100%{opacity:0}}
@keyframes ai-ill-flow-late{0%,25%{stroke-dashoffset:14;opacity:0}29%{opacity:1}55%{stroke-dashoffset:-100;opacity:1}56%,100%{opacity:0}}
@keyframes ai-ill-pulse{0%,100%{fill:#fffaf0}12%{fill:#8fd3cf}30%{fill:#fffaf0}}
@keyframes ai-ill-bar{0%,52%{transform:scaleX(0)}66%,92%{transform:scaleX(1)}100%{transform:scaleX(0)}}
html[data-motion=reduce] .ai-ill-signal{opacity:.55;stroke-dasharray:none}
@media(prefers-reduced-motion:reduce){.ai-ill-signal{opacity:.55;stroke-dasharray:none}}
</style>
<g><line class="ai-ill-edge" x1="48" y1="48" x2="150" y2="30"/><line class="ai-ill-signal ai-ill-first" pathLength="100" style="animation-delay:0.00s" x1="48" y1="48" x2="150" y2="30"/><line class="ai-ill-edge" x1="48" y1="48" x2="150" y2="70"/><line class="ai-ill-signal ai-ill-first" pathLength="100" style="animation-delay:0.12s" x1="48" y1="48" x2="150" y2="70"/><line class="ai-ill-edge" x1="48" y1="48" x2="150" y2="110"/><line class="ai-ill-signal ai-ill-first" pathLength="100" style="animation-delay:0.24s" x1="48" y1="48" x2="150" y2="110"/><line class="ai-ill-edge" x1="48" y1="48" x2="150" y2="150"/><line class="ai-ill-signal ai-ill-first" pathLength="100" style="animation-delay:0.36s" x1="48" y1="48" x2="150" y2="150"/><line class="ai-ill-edge" x1="48" y1="90" x2="150" y2="30"/><line class="ai-ill-signal ai-ill-first" pathLength="100" style="animation-delay:0.12s" x1="48" y1="90" x2="150" y2="30"/><line class="ai-ill-edge" x1="48" y1="90" x2="150" y2="70"/><line class="ai-ill-signal ai-ill-first" pathLength="100" style="animation-delay:0.24s" x1="48" y1="90" x2="150" y2="70"/><line class="ai-ill-edge" x1="48" y1="90" x2="150" y2="110"/><line class="ai-ill-signal ai-ill-first" pathLength="100" style="animation-delay:0.36s" x1="48" y1="90" x2="150" y2="110"/><line class="ai-ill-edge" x1="48" y1="90" x2="150" y2="150"/><line class="ai-ill-signal ai-ill-first" pathLength="100" style="animation-delay:0.00s" x1="48" y1="90" x2="150" y2="150"/><line class="ai-ill-edge" x1="48" y1="132" x2="150" y2="30"/><line class="ai-ill-signal ai-ill-first" pathLength="100" style="animation-delay:0.24s" x1="48" y1="132" x2="150" y2="30"/><line class="ai-ill-edge" x1="48" y1="132" x2="150" y2="70"/><line class="ai-ill-signal ai-ill-first" pathLength="100" style="animation-delay:0.36s" x1="48" y1="132" x2="150" y2="70"/><line class="ai-ill-edge" x1="48" y1="132" x2="150" y2="110"/><line class="ai-ill-signal ai-ill-first" pathLength="100" style="animation-delay:0.00s" x1="48" y1="132" x2="150" y2="110"/><line class="ai-ill-edge" x1="48" y1="132" x2="150" y2="150"/><line class="ai-ill-signal ai-ill-first" pathLength="100" style="animation-delay:0.12s" x1="48" y1="132" x2="150" y2="150"/><line class="ai-ill-edge" x1="150" y1="30" x2="252" y2="62"/><line class="ai-ill-signal ai-ill-second" pathLength="100" style="animation-delay:0.00s" x1="150" y1="30" x2="252" y2="62"/><line class="ai-ill-edge" x1="150" y1="30" x2="252" y2="118"/><line class="ai-ill-signal ai-ill-second" pathLength="100" style="animation-delay:0.12s" x1="150" y1="30" x2="252" y2="118"/><line class="ai-ill-edge" x1="150" y1="70" x2="252" y2="62"/><line class="ai-ill-signal ai-ill-second" pathLength="100" style="animation-delay:0.12s" x1="150" y1="70" x2="252" y2="62"/><line class="ai-ill-edge" x1="150" y1="70" x2="252" y2="118"/><line class="ai-ill-signal ai-ill-second" pathLength="100" style="animation-delay:0.24s" x1="150" y1="70" x2="252" y2="118"/><line class="ai-ill-edge" x1="150" y1="110" x2="252" y2="62"/><line class="ai-ill-signal ai-ill-second" pathLength="100" style="animation-delay:0.24s" x1="150" y1="110" x2="252" y2="62"/><line class="ai-ill-edge" x1="150" y1="110" x2="252" y2="118"/><line class="ai-ill-signal ai-ill-second" pathLength="100" style="animation-delay:0.36s" x1="150" y1="110" x2="252" y2="118"/><line class="ai-ill-edge" x1="150" y1="150" x2="252" y2="62"/><line class="ai-ill-signal ai-ill-second" pathLength="100" style="animation-delay:0.36s" x1="150" y1="150" x2="252" y2="62"/><line class="ai-ill-edge" x1="150" y1="150" x2="252" y2="118"/><line class="ai-ill-signal ai-ill-second" pathLength="100" style="animation-delay:0.00s" x1="150" y1="150" x2="252" y2="118"/></g>
