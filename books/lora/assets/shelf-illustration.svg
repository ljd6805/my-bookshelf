<svg class="lr-ill" viewBox="0 0 340 180" role="img" aria-label="얼려 둔 큰 가중치 행렬 W 옆에서 0에서 시작한 세로로 긴 B와 가로로 긴 A가 차츰 채워지고, 아래 띠에서 GPU 메모리가 전체 미세조정 212GB에서 QLoRA 12GB로 줄어 24GB 선 안으로 들어오는 모습" xmlns="http://www.w3.org/2000/svg">
<style>
.lr-ill-w{fill:#ebe8f4;stroke:#6f6690;stroke-width:1.4}
.lr-ill-cell{fill:#cfc8e4}
.lr-ill-word{font:700 13px sans-serif;fill:#1f1b2b}
.lr-ill-small{font:500 9px sans-serif;fill:#564f69}
.lr-ill-frame{fill:#fbfaff;stroke:#5a3db3;stroke-width:1.4}
.lr-ill-fill{fill:#5a3db3;transform-box:fill-box;animation:lr-ill-grow 6s ease-in-out infinite}
.lr-ill-b{transform-origin:50% 0}
.lr-ill-a{transform-origin:0 50%;animation-name:lr-ill-growx}
.lr-ill-flow{fill:none;stroke:#5a3db3;stroke-width:2;stroke-dasharray:5 5;animation:lr-ill-dash 1.2s linear infinite}
.lr-ill-track{fill:#ebe8f4}
.lr-ill-bar{fill:#a8431c;transform-box:fill-box;transform-origin:0 0;animation:lr-ill-bar 6s ease-in-out infinite}
.lr-ill-limit{stroke:#1f5f97;stroke-width:2;stroke-dasharray:4 3}
.lr-ill-ok{opacity:0;animation:lr-ill-ok 6s ease-in-out infinite}
@keyframes lr-ill-grow{0%,10%{transform:scaleY(0)}45%,85%{transform:scaleY(1)}100%{transform:scaleY(0)}}
@keyframes lr-ill-growx{0%,10%{transform:scaleX(.08)}45%,85%{transform:scaleX(1)}100%{transform:scaleX(.08)}}
@keyframes lr-ill-dash{to{stroke-dashoffset:-20}}
@keyframes lr-ill-bar{0%,15%{transform:scaleX(1)}55%,85%{transform:scaleX(.058)}100%{transform:scaleX(1)}}
@keyframes lr-ill-ok{0%,50%{opacity:0}60%,85%{opacity:1}95%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.lr-ill-fill,.lr-ill-flow,.lr-ill-bar,.lr-ill-ok{animation:none}.lr-ill-bar{transform:scaleX(.058)}.lr-ill-ok{opacity:1}}
html[data-motion=reduce] .lr-ill-fill,html[data-motion=reduce] .lr-ill-flow,html[data-motion=reduce] .lr-ill-bar,html[data-motion=reduce] .lr-ill-ok{animation:none}
html[data-motion=reduce] .lr-ill-bar{transform:scaleX(.058)}
html[data-motion=reduce] .lr-ill-ok{opacity:1}
</style>
<rect class="lr-ill-w" x="14" y="14" width="96" height="96" rx="6"/>
<path class="lr-ill-cell" d="M26 26h14v14H26zM48 26h14v14H48zM70 26h14v14H70zM92 48h8v14h-8zM26 70h14v14H26zM48 48h14v14H48zM70 70h14v14H70zM48 92h14v8H48z"/>
<text class="lr-ill-word" x="62" y="66" text-anchor="middle">W</text>
<text class="lr-ill-small" x="62" y="124" text-anchor="middle">얼려 둠 · 4096×4096</text>
<text class="lr-ill-word" x="126" y="66" text-anchor="middle">+</text>
<rect class="lr-ill-frame" x="142" y="14" width="18" height="96" rx="3"/>
<rect class="lr-ill-fill lr-ill-b" x="145" y="17" width="12" height="90" rx="2"/>
<text class="lr-ill-word" x="151" y="126" text-anchor="middle">B</text>
<rect class="lr-ill-frame" x="174" y="52" width="96" height="18" rx="3"/>
<rect class="lr-ill-fill lr-ill-a" x="177" y="55" width="90" height="12" rx="2"/>
<text class="lr-ill-word" x="222" y="88" text-anchor="middle">A</text>
<text class="lr-ill-small" x="222" y="102" text-anchor="middle">B는 0에서 시작</text>
<path class="lr-ill-flow" d="M276 61H322"/>
<text class="lr-ill-word" x="306" y="48" text-anchor="middle">W′</text>
<text class="lr-ill-small" x="14" y="146">13B 학습 메모리</text>
<rect class="lr-ill-track" x="88" y="138" width="238" height="12" rx="3"/>
<rect class="lr-ill-bar" x="88" y="138" width="238" height="12" rx="3"/>
<path class="lr-ill-limit" d="M115 132V156"/>
<text class="lr-ill-small" x="120" y="168">GPU 24GB</text>
<text class="lr-ill-small lr-ill-ok" x="200" y="168">212GB → 12GB, 들어감</text>
</svg>
