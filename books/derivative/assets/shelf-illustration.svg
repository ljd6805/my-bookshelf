<svg class="dv-ill" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 180" role="img" aria-label="로켓의 높이 곡선 위를 점 하나가 왼쪽에서 오른쪽으로 움직이고, 그 점의 접선이 오르막에서 수평을 지나 내리막으로 기울며, 오른쪽 그래프의 점이 같은 순간의 기울기 값을 따라 직선 위를 내려가는 과정을 보여 주는 시각적 비유">
<style>
.dv-ill-bg{fill:#f1f7f5}
.dv-ill-axis{stroke:#8fa8a2;stroke-width:1.2;fill:none}
.dv-ill-curve{stroke:#0b7a63;stroke-width:3;fill:none;stroke-linecap:round}
.dv-ill-deriv{stroke:#2a56c6;stroke-width:3;fill:none;stroke-linecap:round}
.dv-ill-label{font:600 11px sans-serif;fill:#17463c}
.dv-ill-small{font:500 10px sans-serif;fill:#4c5c66}
.dv-ill-tan{animation:dv-ill-move 6s linear infinite}
.dv-ill-dot{animation:dv-ill-drop 6s linear infinite}
.dv-ill-tan path{stroke:#b4521a;stroke-width:3;stroke-linecap:round}
.dv-ill-tan circle,.dv-ill-dot circle{fill:#b4521a;stroke:#fff;stroke-width:1.5}
@keyframes dv-ill-move{0%{transform:translate(46.0px,110.4px) rotate(-65.6deg)}10%{transform:translate(62.0px,79.6px) rotate(-58.8deg)}20%{transform:translate(78.0px,57.6px) rotate(-47.7deg)}30%{transform:translate(94.0px,44.4px) rotate(-28.8deg)}40%{transform:translate(110.0px,40.0px) rotate(-0.0deg)}50%{transform:translate(126.0px,44.4px) rotate(28.8deg)}60%{transform:translate(142.0px,57.6px) rotate(47.7deg)}70%{transform:translate(158.0px,79.6px) rotate(58.8deg)}80%{transform:translate(174.0px,110.4px) rotate(65.6deg)}100%{transform:translate(174.0px,110.4px) rotate(65.6deg)}}
@keyframes dv-ill-drop{0%{transform:translate(240.8px,53.4px)}80%,100%{transform:translate(311.2px,136.6px)}}
html[data-motion=reduce] .dv-ill-tan,html[data-motion=reduce] .dv-ill-dot{animation:none}
html[data-motion=reduce] .dv-ill-tan{transform:translate(70.0px,67.5px) rotate(-54.0deg)}
html[data-motion=reduce] .dv-ill-dot{transform:translate(254.0px,69.0px)}
@media(prefers-reduced-motion:reduce){.dv-ill-tan,.dv-ill-dot{animation:none}.dv-ill-tan{transform:translate(70.0px,67.5px) rotate(-54.0deg)}.dv-ill-dot{transform:translate(254.0px,69.0px)}}
</style>
<rect class="dv-ill-bg" width="340" height="180"/>
<path class="dv-ill-axis" d="M24 150H200M24 150V22"/>
<path class="dv-ill-curve" d="M30 150Q110 -70 190 150"/>
<g class="dv-ill-tan"><path d="M-30 0H30"/><circle r="5"/></g>
<text class="dv-ill-small" x="200" y="166" text-anchor="end">시각 t</text><text class="dv-ill-label" x="28" y="16">높이 h(t)</text>
<path class="dv-ill-axis" d="M228 95H326M228 156V30"/>
<path class="dv-ill-deriv" d="M232 43L320 147"/>
<g class="dv-ill-dot"><circle r="5"/></g>
<text class="dv-ill-label" x="232" y="22">기울기 h′(t)</text><text class="dv-ill-small" x="326" y="172" text-anchor="end">0을 지나면 최고점</text>
</svg>
