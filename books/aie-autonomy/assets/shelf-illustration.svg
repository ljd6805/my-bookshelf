<svg class="a16-ill" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 180" role="img" aria-label="비유 그림: 야간 에이전트 누리가 도구로 호출을 계속 보내는 동안 비용 막대가 차오르고, 상한선에 닿으면 바깥의 멈춤 단추가 켜져 흐름이 끊깁니다. 실제 계산이 아닌 개념 그림입니다.">
<style>
.a16-ill-bg{fill:#f4f1ea}
.a16-ill-box{fill:#fffaf2;stroke:#8a3b3b;stroke-width:2}
.a16-ill-tool{fill:#fffaf2;stroke:#5d6f7a;stroke-width:2}
.a16-ill-label{font:700 14px sans-serif;fill:#3a2424;text-anchor:middle}
.a16-ill-small{font:600 11px sans-serif;fill:#6b5a54;text-anchor:middle}
.a16-ill-wire{stroke:#d9c5bd;stroke-width:3;fill:none}
.a16-ill-flow{stroke:#b5473f;stroke-width:3;fill:none;stroke-linecap:round;stroke-dasharray:8 22;animation:a16-ill-flow 1.2s linear infinite,a16-ill-cut 6s steps(1,end) infinite}
.a16-ill-track{fill:#ece3dc;stroke:#c9b5ac}
.a16-ill-meter{fill:#d9776c;transform-box:fill-box;transform-origin:left center;animation:a16-ill-fill 6s ease-in infinite}
.a16-ill-cap{stroke:#3a2424;stroke-width:2;stroke-dasharray:3 3}
.a16-ill-stop{fill:#fffaf2;stroke:#8a3b3b;stroke-width:3;animation:a16-ill-stop 6s steps(1,end) infinite}
.a16-ill-fence{stroke:#8a3b3b;stroke-width:1.5;fill:none;stroke-dasharray:6 4}
@keyframes a16-ill-flow{to{stroke-dashoffset:-30}}
@keyframes a16-ill-cut{0%{opacity:1}70%,100%{opacity:0}}
@keyframes a16-ill-fill{0%{transform:scaleX(.05)}70%,100%{transform:scaleX(1)}}
@keyframes a16-ill-stop{0%{fill:#fffaf2}70%,100%{fill:#d9776c}}
html[data-motion=reduce] .a16-ill-flow,html[data-motion=reduce] .a16-ill-meter,html[data-motion=reduce] .a16-ill-stop{animation:none}
@media(prefers-reduced-motion:reduce){.a16-ill-flow,.a16-ill-meter,.a16-ill-stop{animation:none}}
</style>
<rect class="a16-ill-bg" width="340" height="180"/>
<rect class="a16-ill-fence" x="12" y="14" width="236" height="104" rx="10"/>
<text class="a16-ill-small" x="130" y="30">작업 공간 울타리</text>
<rect class="a16-ill-box" x="26" y="44" width="76" height="56" rx="8"/><text class="a16-ill-label" x="64" y="77">누리</text>
<path class="a16-ill-wire" d="M102 72H158"/><path class="a16-ill-flow" d="M102 72H158"/>
<rect class="a16-ill-tool" x="158" y="44" width="76" height="56" rx="8"/><text class="a16-ill-label" x="196" y="77">도구</text>
<circle class="a16-ill-stop" cx="294" cy="66" r="26"/><text class="a16-ill-label" x="294" y="71">멈춤</text>
<text class="a16-ill-small" x="294" y="110">울타리 밖 단추</text>
<text class="a16-ill-small" x="20" y="140" style="text-anchor:start">비용</text>
<rect class="a16-ill-track" x="52" y="130" width="250" height="16" rx="3"/>
<rect class="a16-ill-meter" x="52" y="130" width="250" height="16" rx="3"/>
<path class="a16-ill-cap" d="M302 124V152"/><text class="a16-ill-small" x="302" y="168">상한</text>
</svg>
