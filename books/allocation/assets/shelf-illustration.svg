<svg class="al-ill" viewBox="0 0 340 180" role="img" aria-labelledby="al-ill-title" xmlns="http://www.w3.org/2000/svg">
<title id="al-ill-title">가상 지수 누리200(표준편차 18%)과 채권 묶음(6%)의 한 해 수익률이 출렁이는 선이 그려진 뒤, 둘을 60대 40으로 섞은 선이 상관 −0.2 덕분에 누리200보다 작게 출렁이며 그려지고 표준편차 띠가 10.58% 폭으로 펼쳐지는 과정(미리 정한 가정, 예측 아님)</title>
<style>
.al-ill-bg{fill:#fbf7ef}
.al-ill-word{font:600 10px sans-serif;fill:#2a2116}
.al-ill-small{font:500 9px sans-serif;fill:#5e5040}
.al-ill-base{stroke:#e0d1b8;stroke-width:1}
.al-ill-line{fill:none;stroke-width:2;stroke-linejoin:round;stroke-dasharray:100;stroke-dashoffset:100}
.al-ill-st{stroke:#b0392b;animation:al-ill-draw1 9s linear infinite}
.al-ill-bd{stroke:#2d55ad;stroke-dasharray:3 2;animation:al-ill-fade2 9s linear infinite;stroke-dashoffset:0;opacity:0}
.al-ill-mx{stroke:#8a5800;stroke-width:2.6;animation:al-ill-draw3 9s linear infinite}
.al-ill-band{fill:#dd9a3f;opacity:.16}
.al-ill-band-mx{fill:#dd9a3f;opacity:0;animation:al-ill-band 9s linear infinite}
@keyframes al-ill-draw1{0%{stroke-dashoffset:100}25%,96%{stroke-dashoffset:0}100%{stroke-dashoffset:100}}
@keyframes al-ill-fade2{0%,22%{opacity:0}34%,96%{opacity:1}100%{opacity:0}}
@keyframes al-ill-draw3{0%,38%{stroke-dashoffset:100}66%,96%{stroke-dashoffset:0}100%{stroke-dashoffset:100}}
@keyframes al-ill-band{0%,66%{opacity:0}74%,96%{opacity:.3}100%{opacity:0}}
@media(prefers-reduced-motion:reduce){.al-ill-st,.al-ill-mx{animation:none;stroke-dashoffset:0}.al-ill-bd{animation:none;opacity:1}.al-ill-band-mx{animation:none;opacity:.3}}
html[data-motion=reduce] .al-ill-st,html[data-motion=reduce] .al-ill-mx{animation:none;stroke-dashoffset:0}html[data-motion=reduce] .al-ill-bd{animation:none;opacity:1}html[data-motion=reduce] .al-ill-band-mx{animation:none;opacity:.3}
</style>
