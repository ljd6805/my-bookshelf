<svg class="a08-ill" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 180" role="img" aria-label="문장 끝 토큰 ‘읽었다’가 앞의 토큰들로 굵기가 다른 어텐션 선을 차례로 보내고, 왼쪽 위 삼각 가중치표가 한 줄씩 채워지는 그림. 선의 굵기는 예시 값이며 실제 계산이 아닌 시각적 비유입니다.">
<style>
.a08-ill-bg{fill:#f4f1fa}
