.a08-ill-d0{animation-delay:0.00s}.a08-ill-d1{animation-delay:0.45s}.a08-ill-d2{animation-delay:0.90s}.a08-ill-d3{animation-delay:1.35s}.a08-ill-d4{animation-delay:1.80s}.a08-ill-d5{animation-delay:2.25s}.a08-ill-r0{animation-delay:0.0s}.a08-ill-r1{animation-delay:0.5s}.a08-ill-r2{animation-delay:1.0s}.a08-ill-r3{animation-delay:1.5s}.a08-ill-r4{animation-delay:2.0s}.a08-ill-r5{animation-delay:2.5s}.a08-ill-r6{animation-delay:3.0s}
@keyframes a08-ill-draw{0%{stroke-dashoffset:320}30%,75%{stroke-dashoffset:0}100%{stroke-dashoffset:-320}}
@keyframes a08-ill-fill{0%,5%{opacity:.15}15%,80%{opacity:1}95%,100%{opacity:.15}}
html[data-motion=reduce] .a08-ill-arc,html[data-motion=reduce] .a08-ill-row{animation:none;stroke-dashoffset:0;opacity:1}
