.a08-ill-tok{fill:#fffdf8;stroke:#8c7cc4;stroke-width:1.5}
.a08-ill-q{fill:#e6defc;stroke:#5b3fb8;stroke-width:2.5}
.a08-ill-arc{fill:none;stroke:#7a5fd0;stroke-linecap:round;stroke-dasharray:320;stroke-dashoffset:320;animation:a08-ill-draw 6s ease-in-out infinite}
.a08-ill-row rect{fill:#7a5fd0}
