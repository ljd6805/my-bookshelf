<svg class="fl-ill" viewBox="0 0 340 180" role="img" aria-label="연합학습 한 라운드: 서버가 모델을 휴대폰 세 대로 내려보내고, 휴대폰은 원문을 자기 안에 둔 채 학습해 업데이트만 서버로 올리며, 서버가 셋을 평균해 다음 모델을 만드는 과정을 되풀이하는 모습(시각적 비유)" xmlns="http://www.w3.org/2000/svg">
<style>
.fl-ill-bg{fill:#f8f4fa}
.fl-ill-word{font:600 10px var(--font-sans,sans-serif);fill:#2b1f33}
.fl-ill-small{font:500 9px var(--font-sans,sans-serif);fill:#5d5266}
.fl-ill-box{fill:#ffffff;stroke:#d8cddf;stroke-width:1.2}
.fl-ill-server{fill:#ffffff;stroke:#7a3b94;stroke-width:1.6}
.fl-ill-lock{fill:#eee7f1;stroke:#7a3b94;stroke-width:1}
.fl-ill-path{fill:none;stroke:#d8cddf;stroke-width:1.4;stroke-dasharray:4 4}
.fl-ill-down{fill:#7a3b94}
.fl-ill-up{fill:#c06a2b}
.fl-ill-train{fill:#7a3b94;opacity:.2}
.fl-ill-avg{fill:none;stroke:#7a3b94;stroke-width:2.4;opacity:0}
.fl-ill-d1,.fl-ill-d2,.fl-ill-d3{animation:fl-ill-down 8s ease-in-out infinite}
.fl-ill-u1,.fl-ill-u2,.fl-ill-u3{animation:fl-ill-up 8s ease-in-out infinite;opacity:0}
.fl-ill-t{animation:fl-ill-train 8s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
.fl-ill-ring{animation:fl-ill-avg 8s linear infinite}
.fl-ill-s0{animation:fl-ill-s0 8s linear infinite}
.fl-ill-s1{animation:fl-ill-s1 8s linear infinite;opacity:0}
.fl-ill-s2{animation:fl-ill-s2 8s linear infinite;opacity:0}
.fl-ill-s3{animation:fl-ill-s3 8s linear infinite;opacity:0}
@keyframes fl-ill-down{0%{transform:translate(0,0);opacity:0}4%{opacity:1}22%{transform:translate(var(--dx),70px);opacity:1}26%,100%{transform:translate(var(--dx),70px);opacity:0}}
@keyframes fl-ill-train{0%,24%{transform:scaleX(0)}50%,100%{transform:scaleX(1)}}
@keyframes fl-ill-up{0%,52%{transform:translate(var(--dx),70px);opacity:0}56%{opacity:1}74%{transform:translate(0,0);opacity:1}78%,100%{transform:translate(0,0);opacity:0}}
@keyframes fl-ill-avg{0%,76%{opacity:0}80%,94%{opacity:1}100%{opacity:0}}
@keyframes fl-ill-s0{0%,24%{opacity:1}26%,100%{opacity:0}}
@keyframes fl-ill-s1{0%,24%{opacity:0}26%,50%{opacity:1}52%,100%{opacity:0}}
@keyframes fl-ill-s2{0%,50%{opacity:0}52%,76%{opacity:1}78%,100%{opacity:0}}
@keyframes fl-ill-s3{0%,76%{opacity:0}78%,98%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.fl-ill-d1,.fl-ill-d2,.fl-ill-d3,.fl-ill-u1,.fl-ill-u2,.fl-ill-u3,.fl-ill-t,.fl-ill-ring,.fl-ill-s0,.fl-ill-s1,.fl-ill-s2,.fl-ill-s3{animation:none}.fl-ill-d1,.fl-ill-d2,.fl-ill-d3,.fl-ill-u1,.fl-ill-u2,.fl-ill-u3,.fl-ill-s0,.fl-ill-s1,.fl-ill-s2{opacity:0}.fl-ill-s3,.fl-ill-ring{opacity:1}.fl-ill-t{transform:scaleX(1)}}
html[data-motion=reduce] .fl-ill-d1,html[data-motion=reduce] .fl-ill-d2,html[data-motion=reduce] .fl-ill-d3,html[data-motion=reduce] .fl-ill-u1,html[data-motion=reduce] .fl-ill-u2,html[data-motion=reduce] .fl-ill-u3,html[data-motion=reduce] .fl-ill-t,html[data-motion=reduce] .fl-ill-ring,html[data-motion=reduce] .fl-ill-s0,html[data-motion=reduce] .fl-ill-s1,html[data-motion=reduce] .fl-ill-s2,html[data-motion=reduce] .fl-ill-s3{animation:none}
html[data-motion=reduce] .fl-ill-d1,html[data-motion=reduce] .fl-ill-d2,html[data-motion=reduce] .fl-ill-d3,html[data-motion=reduce] .fl-ill-u1,html[data-motion=reduce] .fl-ill-u2,html[data-motion=reduce] .fl-ill-u3,html[data-motion=reduce] .fl-ill-s0,html[data-motion=reduce] .fl-ill-s1,html[data-motion=reduce] .fl-ill-s2{opacity:0}
html[data-motion=reduce] .fl-ill-s3,html[data-motion=reduce] .fl-ill-ring{opacity:1}
html[data-motion=reduce] .fl-ill-t{transform:scaleX(1)}
</style>
<rect class="fl-ill-bg" width="340" height="180" rx="10"/>
<rect class="fl-ill-server" x="125" y="12" width="90" height="34" rx="6"/>
<text class="fl-ill-word" x="170" y="27" text-anchor="middle">서버</text>
<text class="fl-ill-small" x="170" y="40" text-anchor="middle">모델 w</text>
<rect class="fl-ill-avg fl-ill-ring" x="121" y="8" width="98" height="42" rx="8"/>
<path class="fl-ill-path" d="M170 46L60 112M170 46V112M170 46L280 112"/>
<g style="--dx:-110px"><circle class="fl-ill-down fl-ill-d1" cx="170" cy="48" r="5"/></g>
<g style="--dx:0px"><circle class="fl-ill-down fl-ill-d2" cx="170" cy="48" r="5" style="animation-delay:.15s"/></g>
<g style="--dx:110px"><circle class="fl-ill-down fl-ill-d3" cx="170" cy="48" r="5" style="animation-delay:.3s"/></g>
<g style="--dx:-110px"><rect class="fl-ill-up fl-ill-u1" x="164" y="42" width="12" height="10" rx="2"/></g>
<g style="--dx:0px"><rect class="fl-ill-up fl-ill-u2" x="164" y="42" width="12" height="10" rx="2" style="animation-delay:.2s"/></g>
<g style="--dx:110px"><rect class="fl-ill-up fl-ill-u3" x="164" y="42" width="12" height="10" rx="2" style="animation-delay:.4s"/></g>
<rect class="fl-ill-box" x="34" y="112" width="52" height="54" rx="7"/><rect class="fl-ill-lock" x="40" y="130" width="40" height="14" rx="2"/><text class="fl-ill-small" x="60" y="140" text-anchor="middle">원문</text><rect class="fl-ill-train fl-ill-t" x="40" y="150" width="40" height="6" rx="2"/>
<rect class="fl-ill-box" x="144" y="112" width="52" height="54" rx="7"/><rect class="fl-ill-lock" x="150" y="130" width="40" height="14" rx="2"/><text class="fl-ill-small" x="170" y="140" text-anchor="middle">원문</text><rect class="fl-ill-train fl-ill-t" x="150" y="150" width="40" height="6" rx="2"/>
<rect class="fl-ill-box" x="254" y="112" width="52" height="54" rx="7"/><rect class="fl-ill-lock" x="260" y="130" width="40" height="14" rx="2"/><text class="fl-ill-small" x="280" y="140" text-anchor="middle">원문</text><rect class="fl-ill-train fl-ill-t" x="260" y="150" width="40" height="6" rx="2"/>
<text class="fl-ill-small fl-ill-s0" x="330" y="72" text-anchor="end">① 모델을 내려보냄</text>
<text class="fl-ill-small fl-ill-s1" x="330" y="72" text-anchor="end">② 기기 안에서 학습</text>
<text class="fl-ill-small fl-ill-s2" x="330" y="72" text-anchor="end">③ 업데이트만 올림</text>
<text class="fl-ill-small fl-ill-s3" x="330" y="72" text-anchor="end">④ 서버가 평균</text>
<text class="fl-ill-small" x="10" y="176">원문 상자는 움직이지 않습니다</text>
</svg>
