<svg class="ig-ill" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 180" role="img" aria-label="유입 속도 곡선 아래를 채운 직사각형이 5개에서 10개, 20개로 가늘어지며 곡선에 맞춰지고, 그동안 오른쪽 탱크의 물이 차오르는 과정을 보여 주는 시각적 비유">
<style>
.ig-ill-bg{fill:#f1f6f7}
.ig-ill-axis{stroke:#8fa6ab;stroke-width:1.2;fill:none}
.ig-ill-curve{stroke:#0b6b7d;stroke-width:3;fill:none;stroke-linecap:round}
.ig-ill-r{fill:#3c6fb0;fill-opacity:.42;stroke:#3c6fb0;stroke-width:.7}
.ig-ill-label{font:600 11px sans-serif;fill:#0d4a57}
.ig-ill-small{font:500 10px sans-serif;fill:#52686e}
.ig-ill-a{animation:ig-ill-a 6s linear infinite}
.ig-ill-b{animation:ig-ill-b 6s linear infinite}
.ig-ill-c{animation:ig-ill-c 6s linear infinite}
.ig-ill-tank{stroke:#0b6b7d;stroke-width:2.4;fill:none;stroke-linecap:round}
.ig-ill-water{fill:#3c9fb4;fill-opacity:.55;transform-box:fill-box;transform-origin:center bottom;animation:ig-ill-fill 6s ease-in-out infinite}
.ig-ill-drop{fill:#3c9fb4;animation:ig-ill-drop 1.2s linear infinite}
@keyframes ig-ill-a{0%,28%{opacity:1}33%,95%{opacity:0}100%{opacity:1}}
@keyframes ig-ill-b{0%,28%{opacity:0}33%,61%{opacity:1}66%,100%{opacity:0}}
@keyframes ig-ill-c{0%,61%{opacity:0}66%,95%{opacity:1}100%{opacity:0}}
@keyframes ig-ill-fill{0%{transform:scaleY(.08)}85%,100%{transform:scaleY(1)}}
@keyframes ig-ill-drop{0%{transform:translateY(0);opacity:1}100%{transform:translateY(34px);opacity:0}}
html[data-motion=reduce] .ig-ill-a,html[data-motion=reduce] .ig-ill-b,html[data-motion=reduce] .ig-ill-c,html[data-motion=reduce] .ig-ill-water,html[data-motion=reduce] .ig-ill-drop{animation:none}
html[data-motion=reduce] .ig-ill-a,html[data-motion=reduce] .ig-ill-b,html[data-motion=reduce] .ig-ill-drop{opacity:0}
@media(prefers-reduced-motion:reduce){.ig-ill-a,.ig-ill-b,.ig-ill-c,.ig-ill-water,.ig-ill-drop{animation:none}.ig-ill-a,.ig-ill-b,.ig-ill-drop{opacity:0}}
</style>
<rect class="ig-ill-bg" width="340" height="180"/>
