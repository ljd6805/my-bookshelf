<svg class="lg-ill" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 450" role="img" aria-label="가중치와 과거 토큰의 KV가 GPU로 흘러가 계산되고, 다음 토큰이 하나씩 문장 끝에 붙는 모습. 크기와 속도를 재현하지 않은 개념도입니다.">
<style>
.lg-ill-bg{fill:#eef6f0}
.lg-ill-box{fill:#fffaf0;stroke:#4d9083;stroke-width:2}
.lg-ill-gpu{fill:#d3e8df;stroke:#2f6f62;stroke-width:2.5}
.lg-ill-cell{fill:#4d9083;opacity:.35;animation:lg-ill-blink 2.4s ease-in-out infinite}
.lg-ill-wire{stroke:#9cc4b8;stroke-width:2;fill:none}
.lg-ill-flow{stroke:#b7793d;stroke-width:4;fill:none;stroke-linecap:round;stroke-dasharray:14 120;stroke-dashoffset:14;animation:lg-ill-flow 2.4s ease-in-out infinite}
.lg-ill-kv{animation-delay:.3s}
.lg-ill-out{animation-delay:1.1s}
.lg-ill-label{font:700 22px sans-serif;fill:#244940;text-anchor:middle}
.lg-ill-sub{font:15px sans-serif;fill:#4f6f66;text-anchor:middle}
.lg-ill-tok{fill:#fffaf0;stroke:#b7793d;stroke-width:1.6}
.lg-ill-new{fill:#f3c58f;stroke:#b7793d;stroke-width:1.6;animation:lg-ill-show 2.4s ease-out infinite;animation-delay:1.4s}
.lg-ill-tokt{font:600 14px sans-serif;fill:#5a3c1c;text-anchor:middle}
.lg-ill-newt{animation:lg-ill-show 2.4s ease-out infinite;animation-delay:1.4s}
@keyframes lg-ill-flow{0%{stroke-dashoffset:14}55%,100%{stroke-dashoffset:-120}}
@keyframes lg-ill-blink{0%,100%{opacity:.3}50%{opacity:.9}}
@keyframes lg-ill-show{0%{opacity:0}15%,75%{opacity:1}95%,100%{opacity:0}}
html[data-motion=reduce] .lg-ill-flow,html[data-motion=reduce] .lg-ill-cell,html[data-motion=reduce] .lg-ill-new,html[data-motion=reduce] .lg-ill-newt{animation:none;opacity:1}
html[data-motion=reduce] .lg-ill-flow{stroke-dasharray:none;opacity:.45}
@media(prefers-reduced-motion:reduce){.lg-ill-flow,.lg-ill-cell,.lg-ill-new,.lg-ill-newt{animation:none;opacity:1}.lg-ill-flow{stroke-dasharray:none;opacity:.45}}
</style>
<rect class="lg-ill-bg" width="500" height="450"/>
<rect class="lg-ill-box" x="40" y="40" width="180" height="96" rx="12"/>
<text class="lg-ill-label" x="130" y="82">가중치</text><text class="lg-ill-sub" x="130" y="110">학습된 숫자 수십억 개</text>
<rect class="lg-ill-box" x="280" y="40" width="180" height="96" rx="12"/>
<text class="lg-ill-label" x="370" y="82">KV 캐시</text><text class="lg-ill-sub" x="370" y="110">과거 토큰의 K·V</text>
<path class="lg-ill-wire" d="M130 136V170H250V200M370 136V170H250"/>
<path class="lg-ill-flow" d="M130 136V170H250V200"/>
<path class="lg-ill-flow lg-ill-kv" d="M370 136V170H250V200"/>
<rect class="lg-ill-gpu" x="120" y="200" width="260" height="120" rx="16"/>
<text class="lg-ill-label" x="250" y="236">GPU</text>
<g><rect class="lg-ill-cell" x="160" y="254" width="26" height="22" rx="3"/><rect class="lg-ill-cell" x="196" y="254" width="26" height="22" rx="3" style="animation-delay:.2s"/><rect class="lg-ill-cell" x="232" y="254" width="26" height="22" rx="3" style="animation-delay:.4s"/><rect class="lg-ill-cell" x="268" y="254" width="26" height="22" rx="3" style="animation-delay:.6s"/><rect class="lg-ill-cell" x="304" y="254" width="26" height="22" rx="3" style="animation-delay:.8s"/></g>
<text class="lg-ill-sub" x="250" y="304">읽기 · 곱하기 · 더하기</text>
<path class="lg-ill-wire" d="M250 320V342H372V365"/>
<path class="lg-ill-flow lg-ill-out" d="M250 320V342H372V365"/>
<rect class="lg-ill-tok" x="70" y="365" width="76" height="40" rx="7"/><text class="lg-ill-tokt" x="108" y="390">오늘</text>
<rect class="lg-ill-tok" x="154" y="365" width="76" height="40" rx="7"/><text class="lg-ill-tokt" x="192" y="390">회의는</text>
<rect class="lg-ill-tok" x="238" y="365" width="76" height="40" rx="7"/><text class="lg-ill-tokt" x="276" y="390">세 가지</text>
<rect class="lg-ill-new" x="322" y="365" width="100" height="40" rx="7"/><text class="lg-ill-tokt lg-ill-newt" x="372" y="390">다음 토큰</text>
</svg>
