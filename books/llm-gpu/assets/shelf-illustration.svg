<svg class="lg-ill" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 180" role="img" aria-label="가중치와 과거 토큰의 KV가 GPU로 흘러가 계산되고, 다음 토큰이 하나씩 문장 끝에 붙는 모습. 크기와 속도를 재현하지 않은 개념도입니다.">
<style>
.lg-ill-bg{fill:#eef6f0}
.lg-ill-box{fill:#fffaf0;stroke:#4d9083;stroke-width:2}
.lg-ill-gpu{fill:#d3e8df;stroke:#2f6f62;stroke-width:2.5}
.lg-ill-cell{fill:#4d9083;opacity:.35;animation:lg-ill-blink 2.4s ease-in-out infinite}
.lg-ill-wire{stroke:#9cc4b8;stroke-width:2;fill:none}
.lg-ill-flow{stroke:#b7793d;stroke-width:3;fill:none;stroke-linecap:round;stroke-dasharray:10 90;stroke-dashoffset:10;animation:lg-ill-flow 2.4s ease-in-out infinite}
.lg-ill-kv{animation-delay:.3s}
.lg-ill-out{animation-delay:1.1s}
.lg-ill-label{font:700 14px sans-serif;fill:#244940;text-anchor:middle}
.lg-ill-sub{font:10px sans-serif;fill:#4f6f66;text-anchor:middle}
.lg-ill-tok{fill:#fffaf0;stroke:#b7793d;stroke-width:1.6}
.lg-ill-new{fill:#f3c58f;stroke:#b7793d;stroke-width:1.6;animation:lg-ill-show 2.4s ease-out infinite;animation-delay:1.4s}
.lg-ill-tokt{font:600 11px sans-serif;fill:#5a3c1c;text-anchor:middle}
.lg-ill-newt{animation:lg-ill-show 2.4s ease-out infinite;animation-delay:1.4s}
@keyframes lg-ill-flow{0%{stroke-dashoffset:10}55%,100%{stroke-dashoffset:-90}}
@keyframes lg-ill-blink{0%,100%{opacity:.3}50%{opacity:.9}}
@keyframes lg-ill-show{0%{opacity:0}15%,75%{opacity:1}95%,100%{opacity:0}}
html[data-motion=reduce] .lg-ill-flow,html[data-motion=reduce] .lg-ill-cell,html[data-motion=reduce] .lg-ill-new,html[data-motion=reduce] .lg-ill-newt{animation:none;opacity:1}
html[data-motion=reduce] .lg-ill-flow{stroke-dasharray:none;opacity:.45}
@media(prefers-reduced-motion:reduce){.lg-ill-flow,.lg-ill-cell,.lg-ill-new,.lg-ill-newt{animation:none;opacity:1}.lg-ill-flow{stroke-dasharray:none;opacity:.45}}
</style>
<rect class="lg-ill-bg" width="340" height="180"/>
<rect class="lg-ill-box" x="10" y="12" width="96" height="44" rx="8"/>
<text class="lg-ill-label" x="58" y="32">가중치</text><text class="lg-ill-sub" x="58" y="48">학습된 숫자</text>
<rect class="lg-ill-box" x="10" y="66" width="96" height="44" rx="8"/>
<text class="lg-ill-label" x="58" y="86">KV 캐시</text><text class="lg-ill-sub" x="58" y="102">과거 토큰의 K·V</text>
<path class="lg-ill-wire" d="M106 34H124V52H140M106 88H124V72H140"/>
<path class="lg-ill-flow" d="M106 34H124V52H140"/>
<path class="lg-ill-flow lg-ill-kv" d="M106 88H124V72H140"/>
<rect class="lg-ill-gpu" x="140" y="12" width="188" height="98" rx="12"/>
<text class="lg-ill-label" x="234" y="34">GPU</text>
<g><rect class="lg-ill-cell" x="164" y="46" width="22" height="18" rx="3"/><rect class="lg-ill-cell" x="192" y="46" width="22" height="18" rx="3" style="animation-delay:.2s"/><rect class="lg-ill-cell" x="220" y="46" width="22" height="18" rx="3" style="animation-delay:.4s"/><rect class="lg-ill-cell" x="248" y="46" width="22" height="18" rx="3" style="animation-delay:.6s"/><rect class="lg-ill-cell" x="276" y="46" width="22" height="18" rx="3" style="animation-delay:.8s"/></g>
<text class="lg-ill-sub" x="234" y="92">읽기 · 곱하기 · 더하기</text>
<path class="lg-ill-wire" d="M234 110V126H282V140"/>
<path class="lg-ill-flow lg-ill-out" d="M234 110V126H282V140"/>
<rect class="lg-ill-tok" x="10" y="140" width="62" height="28" rx="6"/><text class="lg-ill-tokt" x="41" y="158">오늘</text>
<rect class="lg-ill-tok" x="78" y="140" width="62" height="28" rx="6"/><text class="lg-ill-tokt" x="109" y="158">회의는</text>
<rect class="lg-ill-tok" x="146" y="140" width="80" height="28" rx="6"/><text class="lg-ill-tokt" x="186" y="158">세 가지로</text>
<rect class="lg-ill-new" x="232" y="140" width="98" height="28" rx="6"/><text class="lg-ill-tokt lg-ill-newt" x="281" y="158">다음 토큰</text>
</svg>
