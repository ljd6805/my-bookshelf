<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 450" role="img" aria-labelledby="title desc"><title id="title">가중치에서 토큰으로</title><desc id="desc">가중치와 KV가 GPU 연산에 사용되고 다음 토큰이 출력됩니다. 크기나 속도를 재현하지 않은 개념도입니다.</desc><defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#e3f4ec"/><stop offset="1" stop-color="#f7f2e5"/></linearGradient></defs><rect width="500" height="450" fill="url(#bg)"/><g stroke="#4d9083" fill="none" stroke-width="2"><rect x="55" y="50" width="165" height="95" rx="12"/><rect x="280" y="50" width="165" height="95" rx="12"/><path d="M137 145v38h226v-38M250 183v37"/><rect x="135" y="220" width="230" height="115" rx="18" fill="#d3e8df"/><path d="M250 335v40"/><rect x="175" y="375" width="150" height="42" rx="8" fill="#fffaf0"/></g><g font-family="sans-serif" text-anchor="middle" fill="#244940"><text x="137" y="88" font-size="22">가중치</text><text x="363" y="88" font-size="22">KV</text><text x="137" y="117" font-size="15">학습된 숫자</text><text x="363" y="117" font-size="15">과거 토큰 정보</text><text x="250" y="265" font-size="28">GPU</text><text x="250" y="300" font-size="17">읽기 · 연산 · 재사용</text><text x="250" y="402" font-size="20">다음 토큰</text></g><circle cx="250" cy="196" r="5" fill="#b7793d"/><style>@media(prefers-reduced-motion:reduce){circle{opacity:1}animate{display:none}}</style></svg>
