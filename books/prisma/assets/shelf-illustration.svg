<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 330" role="img" aria-label="스키마에서 생성한 Client가 데이터베이스에 조회를 보내고 결과를 받는 과정">
<style>.prism-bg{fill:#e8f1ed}.prism-box{fill:#fff;stroke:#5f8b78;stroke-width:2}.prism-edge{fill:none;stroke:#43876d;stroke-width:2;stroke-dasharray:5 5}.prism-text{fill:#294d3e;font:14px var(--font-sans)}.prism-label{fill:#486b5a;font:12px var(--font-sans)}.prism-packet{fill:#2a9871;animation:prism-travel 3s ease-in-out infinite}.prism-row{fill:#b8ddca}.prism-result{fill:#80b8d3;animation:prism-return 3s ease-in-out infinite}@keyframes prism-travel{0%,10%{transform:translate(0,0);opacity:0}20%{opacity:1}70%,100%{transform:translate(220px,0);opacity:0}}@keyframes prism-return{0%,45%{transform:translate(0,0);opacity:0}55%{opacity:1}95%,100%{transform:translate(-220px,0);opacity:0}}@media(prefers-reduced-motion:reduce){.prism-packet,.prism-result{animation:none;opacity:0}}html[data-motion=reduce] .prism-packet,html[data-motion=reduce] .prism-result{animation:none;opacity:0}</style>
<rect class="prism-bg" x="0" y="0" width="500" height="330" rx="20"/><rect class="prism-box" x="30" y="30" width="180" height="70" rx="10"/><text class="prism-text" x="50" y="58">schema.prisma</text><text class="prism-label" x="50" y="80">Project · Task · Run</text><path class="prism-edge" d="M120 100v48"/><text class="prism-label" x="132" y="130">generate</text><rect class="prism-box" x="30" y="150" width="180" height="115" rx="10"/><text class="prism-text" x="50" y="179">Prisma Client</text><text class="prism-label" x="50" y="204">task.findMany()</text><text class="prism-label" x="50" y="232">where → select</text><rect class="prism-box" x="310" y="130" width="160" height="150" rx="16"/><text class="prism-text" x="335" y="158">Database</text><path class="prism-edge" d="M210 185h100M310 240H210"/><circle class="prism-packet" cx="110" cy="185" r="6"/><rect class="prism-result" x="330" y="235" width="14" height="9" rx="2"/><rect class="prism-row" x="333" y="179" width="111" height="16" rx="3"/><rect class="prism-row" x="333" y="204" width="111" height="16" rx="3"/><rect class="prism-row" x="333" y="229" width="111" height="16" rx="3"/><text class="prism-label" x="36" y="305">스키마 · 생성 코드 · 저장된 데이터의 역할을 구분합니다.</text></svg>
