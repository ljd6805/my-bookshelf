<g class="el-ill-out"><circle class="el-ill-node" cx="296" cy="92" r="18"/><text class="el-ill-num" x="296" y="96" text-anchor="middle">1.5</text></g>
<text class="el-ill-small" x="296" y="126" text-anchor="middle">가중합</text>
<text class="el-ill-small" x="258" y="170" text-anchor="middle">2 + 1 + 0 − 1.5 = 1.5</text>
</svg>
