<text class="el-ill-small" x="25" y="168.9">우유</text>
<text class="el-ill-small" x="74" y="48">시럽</text>
<polygon class="el-ill-face el-ill-front" points="68.4,129.4 92.3,136.2 92.3,110.2 68.4,103.4"/>
<polygon class="el-ill-face el-ill-side" points="107.9,124.8 92.3,136.2 92.3,110.2 107.9,98.8"/>
