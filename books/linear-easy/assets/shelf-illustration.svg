<text class="el-ill-small" x="250" y="86" text-anchor="middle">×0.5</text>
<circle class="el-ill-pkt el-ill-pkt2" style="--dx:52px;--dy:0px" cx="226" cy="92" r="3.6"/>
<path class="el-ill-wire" d="M226 132 L278 92"/>
<rect class="el-ill-node" x="184" y="122" width="42" height="20" rx="4"/><text class="el-ill-num" x="205" y="136" text-anchor="middle">시럽 0</text>
<text class="el-ill-small" x="250" y="126" text-anchor="middle">×(−1)</text>
