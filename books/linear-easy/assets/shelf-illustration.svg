<text class="el-ill-word" x="10" y="18">행렬을 곱하면 공간이 늘어납니다</text>
<g class="el-ill-two"><text class="el-ill-small" x="10" y="32">샷 축 2배 · 부피 2배 (행렬식 2)</text></g>
<path class="el-ill-wire" d="M226 52 L278 92"/>
<rect class="el-ill-node" x="184" y="42" width="42" height="20" rx="4"/><text class="el-ill-num" x="205" y="56" text-anchor="middle">샷 2</text>
<text class="el-ill-small" x="250" y="66" text-anchor="middle">×1</text>
