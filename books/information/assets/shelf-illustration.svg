<svg class="it-ill" viewBox="0 0 340 180" role="img" aria-label="메시지 응 지금 가는 중의 공백과 줄바꿈이 허프만 트리를 따라 내려가 00과 100이라는 짧은 비트로 바뀌고, 아래 띠가 UTF-8 168비트에서 허프만 48비트로 줄어드는 모습" xmlns="http://www.w3.org/2000/svg">
<style>
.it-ill-tok{fill:#fffdf8;stroke:#a08a62;stroke-width:1.3}
.it-ill-word{font:600 12px sans-serif;fill:#2a2218}
.it-ill-small{font:500 9px sans-serif;fill:#5f5446}
.it-ill-bit{font:700 12px monospace;fill:#875600}
.it-ill-edge{fill:none;stroke:#7d6a4c;stroke-width:1.6;stroke-linecap:round}
.it-ill-node{fill:#fbf3e2;stroke:#875600;stroke-width:1.6}
.it-ill-path{fill:none;stroke:#875600;stroke-width:3;stroke-linecap:round;stroke-dasharray:120;stroke-dashoffset:120;animation:it-ill-path 6s ease-in-out infinite}
.it-ill-drop{opacity:0;animation:it-ill-drop 6s ease-in-out infinite}
.it-ill-out{opacity:0;animation:it-ill-out 6s ease-in-out infinite}
.it-ill-late{animation-delay:3s}
.it-ill-track{fill:#efe8dc}
.it-ill-bar{fill:#875600;transform-box:fill-box;transform-origin:0 0;animation:it-ill-bar 6s ease-in-out infinite}
@keyframes it-ill-path{0%,10%{stroke-dashoffset:120}30%,45%{stroke-dashoffset:0}55%,100%{stroke-dashoffset:120}}
@keyframes it-ill-drop{0%{opacity:0;transform:translate(0,0)}6%{opacity:1}28%{opacity:1;transform:translate(0,20px)}36%,100%{opacity:0;transform:translate(0,20px)}}
@keyframes it-ill-out{0%,30%{opacity:0}38%,48%{opacity:1}56%,100%{opacity:0}}
@keyframes it-ill-bar{0%,15%{transform:scaleX(1)}55%,85%{transform:scaleX(.29)}100%{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){.it-ill-path,.it-ill-drop,.it-ill-out,.it-ill-bar{animation:none}.it-ill-path{stroke-dashoffset:0}.it-ill-out{opacity:1}.it-ill-bar{transform:scaleX(.29)}}
html[data-motion=reduce] .it-ill-path,html[data-motion=reduce] .it-ill-drop,html[data-motion=reduce] .it-ill-out,html[data-motion=reduce] .it-ill-bar{animation:none}
html[data-motion=reduce] .it-ill-path{stroke-dashoffset:0}
html[data-motion=reduce] .it-ill-out{opacity:1}
html[data-motion=reduce] .it-ill-bar{transform:scaleX(.29)}
</style>
<rect class="it-ill-tok" x="10" y="10" width="26" height="24" rx="4"/><text class="it-ill-word" x="23" y="27" text-anchor="middle">응</text>
<rect class="it-ill-tok" x="40" y="10" width="20" height="24" rx="4"/><text class="it-ill-word" x="50" y="27" text-anchor="middle">␣</text>
<rect class="it-ill-tok" x="64" y="10" width="26" height="24" rx="4"/><text class="it-ill-word" x="77" y="27" text-anchor="middle">지</text>
<rect class="it-ill-tok" x="94" y="10" width="26" height="24" rx="4"/><text class="it-ill-word" x="107" y="27" text-anchor="middle">금</text>
<rect class="it-ill-tok" x="124" y="10" width="20" height="24" rx="4"/><text class="it-ill-word" x="134" y="27" text-anchor="middle">↵</text>
<text class="it-ill-small" x="10" y="50">메시지 한 줄</text>
<path class="it-ill-edge" d="M220 30L180 60M180 60L160 88M180 60L200 88M220 30L262 60M262 60L242 90M262 60L286 88M242 90L228 118M242 90L256 118"/>
<circle class="it-ill-node" cx="220" cy="30" r="7"/><circle class="it-ill-node" cx="180" cy="60" r="6"/><circle class="it-ill-node" cx="262" cy="60" r="6"/><circle class="it-ill-node" cx="242" cy="90" r="5"/>
<rect class="it-ill-tok" x="146" y="88" width="28" height="22" rx="4"/><text class="it-ill-word" x="160" y="104" text-anchor="middle">␣</text>
<rect class="it-ill-tok" x="214" y="118" width="28" height="22" rx="4"/><text class="it-ill-word" x="228" y="134" text-anchor="middle">↵</text>
<text class="it-ill-small" x="204" y="100">…</text><text class="it-ill-small" x="286" y="100">…</text><text class="it-ill-small" x="256" y="130">…</text>
<text class="it-ill-small" x="194" y="44">0</text><text class="it-ill-small" x="244" y="44">1</text>
<path class="it-ill-path" d="M220 30L180 60L160 88"/>
<path class="it-ill-path it-ill-late" d="M220 30L262 60L242 90L228 118"/>
<g class="it-ill-drop"><text class="it-ill-word" x="220" y="10" text-anchor="middle">␣</text></g>
<g class="it-ill-drop it-ill-late"><text class="it-ill-word" x="220" y="10" text-anchor="middle">↵</text></g>
<g class="it-ill-out"><text class="it-ill-bit" x="140" y="104" text-anchor="end">00 ←</text></g>
<g class="it-ill-out it-ill-late"><text class="it-ill-bit" x="208" y="134" text-anchor="end">100 ←</text></g>
<text class="it-ill-small" x="10" y="156">UTF-8 168비트</text>
<rect class="it-ill-track" x="80" y="148" width="200" height="10" rx="2"/>
<text class="it-ill-small" x="10" y="174">허프만 48비트</text>
<rect class="it-ill-track" x="80" y="166" width="200" height="10" rx="2" opacity=".5"/>
<rect class="it-ill-bar" x="80" y="166" width="200" height="10" rx="2"/>
</svg>
