name: Validate shelf and books
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/validate.py
      - run: python3 -m unittest discover -s tests -v
      - run: node --test tests/test_shelf_model.mjs
      - run: npm test --prefix books/ai
      - run: npm test --prefix books/computer
      - run: npm test --prefix books/linear-algebra
      - run: npm test --prefix books/probability
      - run: npm test --prefix books/llm-gpu
      - run: npm test --prefix books/rag
      - run: npm test --prefix books/knowledge-graph
